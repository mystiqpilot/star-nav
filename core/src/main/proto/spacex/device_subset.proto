// The router's configuration. A write changes only the settings whose apply_* flag is true, so
// a request is built from scratch with just the edited settings and their flags (RouterCommand).
// The password-carrying arms of BasicServiceSet.auth and the key fields are marked redacted:
// never log, store or print an unredacted copy.
message WifiConfig {
  message BasicServiceSet {
    string bssid = 1003;
    string ssid = 1005;
    // WifiConfig.Band: UNKNOWN=0 RF_2GHZ=2 RF_5GHZ=5 RF_5GHZ_HIGH=6
    int32 band = 1011;
    bool disable = 1013;
    bool hidden = 1015;
    string iface_name = 1017;
    oneof auth {
      AuthOpen auth_open = 2001;
      AuthWpa2 auth_wpa2 = 2002;
      AuthWpa3 auth_wpa3 = 2003;
      AuthWpa2Wpa3 auth_wpa2_wpa3 = 2004;
      AuthRadius auth_radius = 2005;
      AuthOpenEncrypted auth_open_encrypted = 2006;
      AuthOnboardRadius auth_onboard_radius = 2007;
    }
  }

  message Network {
    string ipv4 = 1003;
    repeated BasicServiceSet basic_service_sets = 1007;
    bool client_isolation = 1008;
    bool guest = 1009;
    string domain = 1011;
    uint32 dhcpv4_start = 1012;
    bool internal_network = 1013;
    uint32 vlan = 1014;
    bool dhcp_disabled = 1015;
    uint32 dhcpv4_lease_duration_s = 1016;
    uint32 dhcpv4_end = 1025;
    bool disable_when_offline = 1031;
    TlsConfig onboard_radius_tls_config = 1033;
    bool dns_disabled = 1034;
    bool default_route_disabled = 1036;
    // GeofenceAction: NONE=0 DISABLE_RADIOS_AND_BLOCK_TRAFFIC=1 BLOCK_TRAFFIC=2
    int32 geofence_action = 1038;
  }

  string country_code = 3;
  bool setup_complete = 7;
  uint32 version = 9;
  string mac_wan = 12;
  string mac_lan = 13;
  uint32 channel_2ghz = 19;
  uint32 channel_5ghz = 20;
  repeated PublicKey dynamic_keys = 22 [(redacted) = true];
  bool is_repeater = 23;
  repeated string nameservers = 30;
  bool bypass_mode = 31;
  bool dfs_enabled = 42;
  uint64 incarnation = 43;
  bool is_aviation = 49;
  bool secure_dns = 50;
  bool ap_mode = 51;
  repeated ClientName client_names = 62;
  bool outdoor_mode = 63;
  bool disable_2ghz = 64;
  bool disable_5ghz = 65;
  bool disable_5ghz_high = 66;
  repeated ClientConfig client_configs = 74;
  bytes client_key = 76 [(redacted) = true];
  bool disable_band_steering = 95;
  bool apply_setup_complete = 1010;
  bool apply_client_names = 1074;
  bool apply_nameservers = 1054;
  bool apply_bypass_mode = 1055;
  bool apply_secure_dns = 1065;
  bool apply_outdoor_mode = 1075;
  bool apply_disable_2ghz = 1076;
  bool apply_disable_5ghz = 1077;
  bool apply_disable_5ghz_high = 1078;
  bool apply_client_configs = 1089;
  bool apply_disable_band_steering = 1109;
  bool apply_http_server = 1107;
  HttpServer http_server = 1108;
  repeated Network networks = 1100;
  bool apply_networks = 1101;
  bool custom_dns_disabled = 1117;
  bool apply_custom_dns_disabled = 1118;
}

message PublicKey {
  string key = 1 [(redacted) = true];
}

message TlsConfig {
  string key = 1 [(redacted) = true];
  string cert = 2;
  string client_ca_cert = 3;
  string server_ca_cert = 4;
}

message HttpServer {
  string domain_name = 1;
  TlsConfig tls = 2;
}

message AuthOpen {}
message AuthOpenEncrypted {}
message AuthOnboardRadius {}

message AuthWpa2 {
  string password = 1 [(redacted) = true];
}

message AuthWpa3 {
  string password = 1 [(redacted) = true];
}

message AuthWpa2Wpa3 {
  string password = 1 [(redacted) = true];
}

message AuthRadius {
  string server = 1;
  string password = 2 [(redacted) = true];
  string server_ca = 3;
  string server_ca_base_64 = 4;
  // Protocol: TCP=0 UDP=1 TLS=2 DTLS=3
  int32 transport = 5;
}

message WeeklyBlockSchedule {
  message BlockRange {
    uint32 start_minutes = 1;
    uint32 end_minutes = 2;
  }
  repeated BlockRange block_ranges = 1;
  string group_id = 2;
}

// Client pausing: blocked during the listed weekly ranges (minutes since the start of the week).
message ClientConfig {
  uint32 client_id = 1;
  string mac_address = 2;
  string given_name = 3;
  repeated WeeklyBlockSchedule weekly_block_schedules = 5;
  string group_id = 6;
}

message ClientName {
  string mac_address = 1;
  string given_name = 2;
}
