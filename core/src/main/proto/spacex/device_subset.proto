// Minimal subset of the Starlink local API (service SpaceX.API.Device.Device, RPC Handle),
// served by the dish (192.168.100.1:9200/9201) and, for the wifi_* arms, by the router (the
// Wi-Fi gateway :9000/9001). Only the fields this app reads or writes are declared; everything
// else stays in Wire's unknown fields and survives re-encoding (a router config read, edited
// and written back keeps what it did not understand), and raw dish response bytes are logged
// so newer schemas can re-decode old sessions. Router replies are never logged raw: they hold
// Wi-Fi passwords and keys (fields marked redacted, see core/.../dish/Redact.kt).
//
// Field numbers follow the community reflection of dish firmware 2026.09.18.mr87170.1 and
// 2026.08.26.mr85524 (github.com/clarkzjw/starlink-grpc-golang, proto/spacex_api/device/*.proto).
// Note that some responses use other numbers than their requests (inhibit GPS: request 2014,
// response 2013; clear obstruction map: 2017 / 2015; history: 1007 / 2006).
// Message names here are ours (they do not travel on the wire). Enum-typed fields are
// declared as int32 so unknown enum values from newer firmware decode without loss.
//
// NEVER members (dish-features-2026-10-15.md: fuse, set_sku, set_trusted_keys, software_update,
// initiate_remote_ssh, set_test_mode, EMC, calibration / RF test, unlock, iq_capture,
// toggle_mode, debug dumps, tcp/udp/iperf tests, ...) are not declared and must not be;
// NeverRequestsTest pins that by tag number.
//
// Every field whose name contains password, secret, key or credential carries
// [(redacted) = true]: Wire prints it as a block and ADAPTER.redact() clears it.
syntax = "proto3";

package SpaceX.API.Device;

option java_package = "tools.apachi.starlinknav.core.dish.proto";

import "google/protobuf/descriptor.proto";

// Wire's redaction marker: toString() prints a block instead of the value and ADAPTER.redact()
// clears the field.
extend google.protobuf.FieldOptions {
  optional bool redacted = 22001;
}

message DeviceRequest {
  uint64 id = 1;
  string target_id = 13;
  uint64 epoch_id = 14;
  oneof request {
    RebootRequest reboot = 1001;
    GetStatusRequest get_status = 1004;
    GetHistoryRequest get_history = 1007;
    GetDeviceInfoRequest get_device_info = 1008;
    GetPingRequest get_ping = 1009;
    FactoryResetRequest factory_reset = 1011;
    UpdateRequest update = 1014;
    GetNetworkInterfacesRequest get_network_interfaces = 1015;
    PingHostRequest ping_host = 1016;
    GetLocationRequest get_location = 1017;
    GetPersistentStatsRequest get_persistent_stats = 1022;
    GetConnectionsRequest get_connections = 1023;
    StartSpeedtestRequest start_speedtest = 1027;
    GetSpeedtestStatusRequest get_speedtest_status = 1028;
    GetRadioStatsRequest get_radio_stats = 1036;
    GetTimeRequest time = 1037;
    DishStowRequest dish_stow = 2002;
    DishGetObstructionMapRequest dish_get_obstruction_map = 2008;
    DishSetConfigRequest dish_set_config = 2010;
    DishGetConfigRequest dish_get_config = 2011;
    DishPowerSaveRequest dish_power_save = 2013;
    DishInhibitGpsRequest dish_inhibit_gps = 2014;
    DishClearObstructionMapRequest dish_clear_obstruction_map = 2017;
    DishFactoryResetRequest dish_factory_reset = 2021;
    DishInhibitRfRequest dish_inhibit_rf = 2026;
    // Router (the server on the Wi-Fi gateway); the dish answers these UNIMPLEMENTED.
    WifiSetConfigRequest wifi_set_config = 3001;
    WifiGetClientsRequest wifi_get_clients = 3002;
    WifiGetPingMetricsRequest wifi_get_ping_metrics = 3007;
    WifiGetConfigRequest wifi_get_config = 3009;
    WifiSetClientGivenNameRequest wifi_set_client_given_name = 3017;
    WifiGuestInfoRequest wifi_guest_info = 3020;
    GetDiagnosticsRequest get_diagnostics = 6000;
    GetGnssMeasurementRequest get_gnss_measurement = 7000;
  }
}

message GetStatusRequest {
  // RouterRole: UNSPECIFIED=0 CONTROLLER=1 REPEATER=2 BYPASSED=3; only meaningful to a router.
  int32 router_role = 1;
}
message GetDeviceInfoRequest {}
message GetDiagnosticsRequest {}
message GetGnssMeasurementRequest {}
message RebootRequest {}
message GetHistoryRequest {}
message DishGetObstructionMapRequest {}
message DishGetConfigRequest {}
message DishClearObstructionMapRequest {}
message GetPingRequest {}
message FactoryResetRequest {}
message GetNetworkInterfacesRequest {}
message GetPersistentStatsRequest {}
message GetConnectionsRequest {}
message GetSpeedtestStatusRequest {}
message GetRadioStatsRequest {}
message GetTimeRequest {}
message WifiGetClientsRequest {}
message WifiGetPingMetricsRequest {}
message WifiGetConfigRequest {}
message WifiGuestInfoRequest {}

message UpdateRequest {
  // optional: absent (not false) when the caller does not say; semantics of true unverified.
  optional bool schedule_reboot = 1;
}

message PingHostRequest {
  string address = 3;
  uint32 size = 4;
}

message StartSpeedtestRequest {
  int32 duration_s = 1;
  // Reports the result to Starlink; Star Nav always sends false.
  bool send_telemetry = 2;
}

// Sleep schedule. Start is minutes past midnight UTC. Duration 0 is rejected even when
// disabling (send 1..1440). The reply carries no response arm.
message DishPowerSaveRequest {
  uint32 power_save_start_minutes = 1;
  uint32 power_save_duration_minutes = 2;
  bool enable_power_save = 3;
}

message DishFactoryResetRequest {
  bool app_reset = 1;
}

message WifiSetConfigRequest {
  WifiConfig wifi_config = 1;
}

message WifiSetClientGivenNameRequest {
  ClientName client_name = 1;
  ClientConfig client_config = 2;
}

message DishStowRequest {
  bool unstow = 1;
}

message DishInhibitGpsRequest {
  bool inhibit_gps = 1;
}

message DishInhibitRfRequest {
  bool inhibit_rf = 1;
}

message DishSetConfigRequest {
  DishConfig dish_config = 1;
}

// Each setting has an apply_* flag: only flagged settings change.
message DishConfig {
  // SnowMeltMode: AUTO=0 ALWAYS_ON=1 ALWAYS_OFF=2
  int32 snow_melt_mode = 1;
  bool apply_snow_melt_mode = 1001;
  // LocationRequestMode: NONE=0 LOCAL=1 (LOCAL lets GetLocation answer on the local network)
  int32 location_request_mode = 2;
  bool apply_location_request_mode = 2001;
  // LevelDishMode: TILT_LIKE_NORMAL=0 FORCE_LEVEL=1
  int32 level_dish_mode = 3;
  bool apply_level_dish_mode = 3001;
  uint32 power_save_start_minutes = 4;
  bool apply_power_save_start_minutes = 4001;
  uint32 power_save_duration_minutes = 5;
  bool apply_power_save_duration_minutes = 5001;
  bool power_save_mode = 6;
  bool apply_power_save_mode = 6001;
  bool swupdate_three_day_deferral_enabled = 7;
  bool apply_swupdate_three_day_deferral_enabled = 7001;
  uint32 asset_class = 8;
  bool apply_asset_class = 8001;
  uint32 swupdate_reboot_hour = 9;
  bool apply_swupdate_reboot_hour = 9001;
}

message GetLocationRequest {
  // PositionSource: AUTO=0 NONE=1 UT_INFO=2 EXTERNAL=3 GPS=4 STARLINK=5 GNC_FUSED=6 GNC_BAD_SAT=7
  int32 source = 1;
}

// SpaceX.API.Status.Status
message RpcStatus {
  int32 code = 1;
  string message = 2;
}

message DeviceResponse {
  uint64 id = 1;
  RpcStatus status = 2;
  uint64 api_version = 3;
  oneof response {
    RebootResponse reboot = 1001;
    GetDeviceInfoResponse get_device_info = 1004;
    GetPingResponse get_ping = 1009;
    FactoryResetResponse factory_reset = 1011;
    UpdateResponse update = 1014;
    GetNetworkInterfacesResponse get_network_interfaces = 1015;
    PingHostResponse ping_host = 1016;
    GetLocationResponse get_location = 1017;
    GetConnectionsResponse get_connections = 1023;
    StartSpeedtestResponse start_speedtest = 1027;
    GetSpeedtestStatusResponse get_speedtest_status = 1028;
    // Request 1036 answers with 1035.
    GetRadioStatsResponse get_radio_stats = 1035;
    GetTimeResponse time = 1037;
    DishStowResponse dish_stow = 2002;
    DishGetStatusResponse dish_get_status = 2004;
    DishGetHistoryResponse dish_get_history = 2006;
    DishGetObstructionMapResponse dish_get_obstruction_map = 2008;
    DishSetConfigResponse dish_set_config = 2010;
    DishGetConfigResponse dish_get_config = 2011;
    DishInhibitGpsResponse dish_inhibit_gps = 2013;
    DishClearObstructionMapResponse dish_clear_obstruction_map = 2015;
    DishFactoryResetResponse dish_factory_reset = 2021;
    DishInhibitRfResponse dish_inhibit_rf = 2026;
    // Router replies (get_status 1004 and get_history 1007 answer with these on the router;
    // get_persistent_stats 1022 answers with 3022).
    WifiSetConfigResponse wifi_set_config = 3001;
    WifiGetClientsResponse wifi_get_clients = 3002;
    WifiGetStatusResponse wifi_get_status = 3004;
    WifiGetHistoryResponse wifi_get_history = 3006;
    WifiGetPingMetricsResponse wifi_get_ping_metrics = 3007;
    WifiGetConfigResponse wifi_get_config = 3009;
    WifiGuestInfoResponse wifi_guest_info = 3020;
    WifiGetPersistentStatsResponse wifi_get_persistent_stats = 3022;
    WifiGetDiagnosticsResponse wifi_get_diagnostics = 6000;
    DishGetDiagnosticsResponse dish_get_diagnostics = 6001;
    GetGnssMeasurementResponse get_gnss_measurement = 7000;
  }
}

message RebootResponse {}
message DishStowResponse {}
message DishClearObstructionMapResponse {}
message FactoryResetResponse {}
message UpdateResponse {}
message StartSpeedtestResponse {}
message DishFactoryResetResponse {}

message DishInhibitGpsResponse {
  bool inhibit_gps = 1;
}

message DishInhibitRfResponse {
  bool inhibit_rf = 1;
}

message DishSetConfigResponse {
  DishConfig updated_dish_config = 1;
  string error = 2;
}

message DishGetConfigResponse {
  DishConfig dish_config = 1;
}

// Ring buffers, one sample per second; `current` counts samples ever written, so the newest
// sample sits at index (current - 1) % size.
message DishGetHistoryResponse {
  uint64 current = 1;
  repeated float pop_ping_drop_rate = 1001;
  repeated float pop_ping_latency_ms = 1002;
  repeated float downlink_throughput_bps = 1003;
  repeated float uplink_throughput_bps = 1004;
  repeated DishOutage outages = 1009;
  repeated float power_in = 1010;
  EventLog event_log = 1011;
}

message DishOutage {
  // Cause: UNKNOWN=0 BOOTING=1 STOWED=2 THERMAL_SHUTDOWN=3 NO_SCHEDULE=4 NO_SATS=5 OBSTRUCTED=6
  // NO_DOWNLINK=7 NO_PINGS=8 ACTUATOR_ACTIVITY=9 CABLE_TEST=10 SLEEPING=11 SKY_SEARCH=13 INHIBIT_RF=14
  int32 cause = 1;
  int64 start_timestamp_ns = 2;
  uint64 duration_ns = 3;
  bool did_switch = 4;
}

message EventLog {
  repeated UXEvent events = 1;
  int64 start_timestamp_ns = 2;
  int64 current_timestamp_ns = 3;
}

message UXEvent {
  // EventSeverity: UNKNOWN=0 WARNING=1 CAUTION=2 ADVISORY=3
  int32 severity = 1;
  // EventReason 0..53, see EventReason in core (Labels.kt)
  int32 reason = 2;
  int64 start_timestamp_ns = 3;
  uint64 duration_ns = 4;
  // Only router events carry metadata (client, mesh and BSS events).
  oneof metadata {
    ClientReconnectingOftenMetadata client_reconnecting_often_metadata = 5;
    ClientSwitchingBandMetadata client_switching_band_metadata = 6;
    ClientSwitchingUpstreamMacMetadata client_switching_upstream_mac_metadata = 7;
    MeshConnectionChangingMetadata mesh_connection_changing_metadata = 8;
    MeshBackhaulLowPhyMetadata mesh_backhaul_low_phy_metadata = 9;
    HighOverlappingBssMetadata high_overlapping_bss_metadata = 10;
    ClientExcessiveNetworkConnectionsMetadata client_excessive_network_connections_metadata = 11;
  }
  // Identifier of the device the event is about (a mesh node); cleared by the exporter.
  string device_id = 12;
}

message ClientReconnectingOftenMetadata {
  uint32 client_id = 1;
}

message ClientExcessiveNetworkConnectionsMetadata {
  uint32 client_id = 1;
}

message ClientSwitchingBandMetadata {
  uint32 client_id = 1;
  string from_band = 2;
  string to_band = 3;
}

message ClientSwitchingUpstreamMacMetadata {
  uint32 client_id = 1;
}

message MeshConnectionChangingMetadata {
  string repeater_id = 1;
  // MeshConnectionChange: UNKNOWN=0 DISCONNECTED=1
  int32 change = 2;
}

message MeshBackhaulLowPhyMetadata {
  repeated string repeater_ids = 1;
}

message HighOverlappingBssStats {
  string iface = 1;
  uint32 average_overlapping_bss_percentage = 2;
}

message HighOverlappingBssMetadata {
  repeated HighOverlappingBssStats high_overlapping_bss_stats = 1;
}

// SNR per sky cell, row-major; -1 = no data.
message DishGetObstructionMapResponse {
  uint32 num_rows = 1;
  uint32 num_cols = 2;
  repeated float snr = 3;
  float min_elevation_deg = 4;
  float max_theta_deg = 5;
  // ObstructionMapReferenceFrame: FRAME_UNKNOWN=0 FRAME_EARTH=1 FRAME_UT=2
  int32 map_reference_frame = 6;
}

message GetDeviceInfoResponse {
  DeviceInfo device_info = 1;
}

message DeviceInfo {
  string id = 1;
  string hardware_version = 2;
  string software_version = 3;
  string country_code = 4;
  int32 utc_offset_s = 5;
  bool software_partitions_equal = 6;
  bool is_dev = 7;
  int32 bootcount = 8;
  int32 anti_rollback_version = 9;
  bool is_hitl = 10;
  BootInfo boot = 1001;
  string manufactured_version = 11;
  int64 generation_number = 12;
  // True when the router is built into the dish housing (the Mini's integrated router).
  bool dish_cohoused = 13;
  int32 board_rev = 14;
  string build_id = 15;
  // HardwareIndex: router hardware only (ROUTER_MINI_COHOUSED_1=1021, ROUTER_MINI_1=1040, ...).
  int32 hardware_index = 16;
}

message DeviceState {
  uint64 uptime_s = 1;
}

// Why the device last came up, and how often it has for each reason.
message BootInfo {
  // map<int32, int32> on the wire: BootReason -> count.
  repeated BootReasonCount count_by_reason = 1;
  // BootReason: UNKNOWN=0 FORGOTTEN=1 POWER_CYCLE=2 COMMAND=3 SOFTWARE_UPDATE=4 CONFIG_UPDATE=5
  // UPTIME_FDIR=6 REPEATER_FDIR=7 AVIATION_ETH_WAN_FDIR=8 KERNEL_PANIC=9 MCU_BRINGUP_FAILED_FDIR=11
  // AVIATION_OUTAGE_FDIR=12 SOFTWARE_WATCHDOG=13 INTENTIONAL_KERNEL_PANIC=14 HARDWARE_WATCHDOG=15
  // REPEATER_UNTRUSTED_FDIR=16
  int32 last_reason = 2;
  int32 last_count = 3;
  repeated BootReasonCount count_by_reason_delta = 4;
  bool crash_boot = 5;
  int32 crash_boot_count = 6;
  string even_side_software_version = 7;
  string odd_side_software_version = 8;
  int32 api_version_odd_side = 9;
  int32 api_version_even_side = 10;
}

message BootReasonCount {
  // map key / value on the wire: BootReason -> times
  int32 reason = 1;
  int32 times = 2;
}

message SoftwareUpdateStats {
  // SoftwareUpdateState, as in DishGetStatusResponse.software_update_state
  int32 software_update_state = 1;
  float software_update_progress = 2;
  bool update_requires_reboot = 3;
  int64 reboot_scheduled_utc_time = 4;
}

message LLAPosition {
  double lat = 1;
  double lon = 2;
  double alt = 3;
}

message GetLocationResponse {
  LLAPosition lla = 1;
  int32 source = 3;
  double sigma_m = 4;
  double horizontal_speed_mps = 5;
  double vertical_speed_mps = 6;
}

message Quaternion {
  float q_scalar = 1;
  float q_x = 2;
  float q_y = 3;
  float q_z = 4;
}

message DishGpsStats {
  bool gps_valid = 1;
  uint32 gps_sats = 2;
  bool no_sats_after_ttff = 3;
  bool inhibit_gps = 4;
  // AttitudeEstimationState: FILTER_RESET=0 UNCONVERGED=1 CONVERGED=2 FAULTED=3 INVALID=4
  int32 pnt_filter_convergence_state = 5;
}

message AlignmentStats {
  int32 has_actuators = 1;
  int32 actuator_state = 2;
  float tilt_angle_deg = 3;
  float boresight_azimuth_deg = 4;
  float boresight_elevation_deg = 5;
  int32 attitude_estimation_state = 6;
  float attitude_uncertainty_deg = 7;
  float desired_boresight_azimuth_deg = 8;
  float desired_boresight_elevation_deg = 9;
}

message DishAlerts {
  bool motors_stuck = 1;
  bool thermal_shutdown = 2;
  bool thermal_throttle = 3;
  bool unexpected_location = 4;
  bool mast_not_near_vertical = 5;
  bool slow_ethernet_speeds = 6;
  bool install_pending = 8;
  bool is_heating = 9;
  bool power_supply_thermal_throttle = 10;
  bool is_power_save_idle = 11;
  bool dbf_telem_stale = 14;
  bool low_motor_current = 16;
  bool lower_signal_than_predicted = 17;
  bool slow_ethernet_speeds_100 = 18;
  bool obstruction_map_reset = 19;
  bool dish_water_detected = 20;
  bool router_water_detected = 21;
  bool upsu_router_port_slow = 22;
  bool no_ethernet_link = 23;
}

message DishObstructionStats {
  float fraction_obstructed = 1;
  float valid_s = 4;
  bool currently_obstructed = 5;
  float avg_prolonged_obstruction_duration_s = 6;
  float avg_prolonged_obstruction_interval_s = 7;
  bool avg_prolonged_obstruction_valid = 8;
  float time_obstructed = 9;
  uint32 patches_valid = 10;
}

message DishReadyStates {
  bool cady = 1;
  bool scp = 2;
  bool l1l2 = 3;
  bool xphy = 4;
  bool aap = 5;
  bool rf = 6;
}

message DishGetStatusResponse {
  DeviceInfo device_info = 1;
  DeviceState device_state = 2;
  float seconds_to_first_nonempty_slot = 1002;
  DishObstructionStats obstruction_stats = 1004;
  DishAlerts alerts = 1005;
  bool stow_requested = 1010;
  DishOutage outage = 1014;
  int32 eth_speed_mbps = 1016;
  bool is_snr_above_noise_floor = 1018;
  DishReadyStates ready_states = 1019;
  // SoftwareUpdateState: UNKNOWN=0 IDLE=1 FETCHING=2 PRE_CHECK=3 WRITING=4 POST_CHECK=5
  // REBOOT_REQUIRED=6 DISABLED=7 FAULTED=8
  int32 software_update_state = 1021;
  bool is_snr_persistently_low = 1022;
  // HasActuators: UNKNOWN=0 YES=1 NO=2
  int32 has_actuators = 1023;
  bool is_cell_disabled = 1029;
  bool swupdate_reboot_ready = 1030;
  int32 seconds_until_swupdate_reboot_possible = 1031;
  // RebootReason: NONE=0 MANUAL=1 LOSS_OF_COMM=2 SWUPDATE_NOW=3 SWUPDATE_SCHEDULED=4 APP=5 EMC=6
  // FACTORY_RESET=7 TEST_CASE=8 THERMAL_POWER_CUT=9 CRITICAL_PROCESS_DIED=10 NO_RF_READY=11
  // POSTPONED_LOSS_OF_COMM=12 SWUPDATE_STATIONARY=13 AAP_CRASH=14 XP70_SACS=15 INE_FAILED=16
  // KERNEL_TAINTED=17 MINI2_AUTO_OFF=18 BATTERY_AUTO_OFF=19 HARD_POWER_DOWN=100 ERROR_*=200..204
  int32 reboot_reason = 1032;
  SoftwareUpdateStats software_update_stats = 1026;
  // RateLimitReason, non-zero while the plan restricts bandwidth
  int32 dl_bandwidth_restricted_reason = 1044;
  int32 ul_bandwidth_restricted_reason = 1045;
  DishConfig config = 2000;
  float pop_ping_drop_rate = 1003;
  float downlink_throughput_bps = 1007;
  float uplink_throughput_bps = 1008;
  float pop_ping_latency_ms = 1009;
  float boresight_azimuth_deg = 1011;
  float boresight_elevation_deg = 1012;
  DishGpsStats gps_stats = 1015;
  // UserMobilityClass: STATIONARY=0 NOMADIC=1 MOBILE=2
  int32 mobility_class = 1017;
  int32 class_of_service = 1020;
  int32 disablement_code = 1024;
  AlignmentStats alignment_stats = 1027;
  bool is_moving_fast_persisted = 1042;
  Quaternion ned2dish_quaternion = 1049;
  float signal_quality = 1057;
  bool has_signed_cals = 1025;
  InitializationDurationSeconds initialization_duration_seconds = 1028;
  bool high_power_test_mode = 1033;
  // Router identifiers: the exporter clears them.
  repeated string connected_routers = 1040;
  // map<string, RouterInfo> on the wire: router id -> role and last seen.
  repeated DownstreamRoutersEntry downstream_routers = 1050;
  DishUpsuStats upsu_stats = 1043;
  DishApsStats aps_stats = 1048;
  // AccountShard: UNKNOWN=0 DEFAULT=1 INDIA=2 STARSHIELD=3
  int32 account_shard = 1051;
  bool mac_flag = 1052;
  // NatFlag: UNKNOWN=0 DISABLED=1 ENABLED=2
  int32 nat_flag = 1053;
  DishBatteryStats battery_stats = 1054;
  bool user_debug_mode_enabled = 1055;
  // The app asks the OS to restrict data use on this dish's network.
  bool treat_as_metered = 1056;
}

message DownstreamRoutersEntry {
  // map key on the wire
  string router_id = 1;
  RouterInfo value = 2;
}

message RouterInfo {
  // RouterRole: UNSPECIFIED=0 CONTROLLER=1 REPEATER=2 BYPASSED=3
  int32 role = 1;
  int64 last_seen = 2;
}

// Seconds since boot at which each start-up stage was reached (0 = not reached / not reported).
message InitializationDurationSeconds {
  int32 attitude_initialization = 1;
  int32 burst_detected = 2;
  int32 ekf_converged = 3;
  int32 first_cplane = 4;
  int32 first_pop_ping = 5;
  int32 gps_valid = 6;
  int32 initial_network_entry = 7;
  int32 network_schedule = 8;
  int32 rf_ready = 9;
  int32 stable_connection = 10;
}

// Only the power fields are declared; watts.
message DishUpsuStats {
  float dish_power = 6;
  float router_power = 7;
}

message DishApsStats {
  float dish_power = 6;
}

message DishBatteryStats {
  uint32 state_of_charge = 1;
  bool is_charging = 2;
  // PowerSource: UNKNOWN=0 USBC=1 BATTERY=2 USBC_AND_BATTERY=3
  int32 power_source = 3;
}

message DishGetDiagnosticsResponse {
  message Location {
    bool enabled = 1;
    double latitude = 2;
    double longitude = 3;
    double altitude_meters = 4;
    bool uncertainty_meters_valid = 5;
    double uncertainty_meters = 6;
    double gps_time_s = 7;
  }
  message Alerts {
    bool dish_is_heating = 1;
    bool dish_thermal_throttle = 2;
    bool dish_thermal_shutdown = 3;
    bool power_supply_thermal_throttle = 4;
    bool motors_stuck = 5;
    bool mast_not_near_vertical = 6;
    bool slow_ethernet_speeds = 7;
    bool software_install_pending = 8;
    bool obstructed = 10;
  }
  message AlignmentStats {
    float boresight_azimuth_deg = 1;
    float boresight_elevation_deg = 2;
    float desired_boresight_azimuth_deg = 3;
    float desired_boresight_elevation_deg = 4;
  }
  string id = 1;
  string hardware_version = 2;
  string software_version = 3;
  int32 utc_offset_s = 4;
  Alerts alerts = 5;
  int32 disablement_code = 6;
  // TestResult: NO_RESULT=0 PASSED=1 FAILED=2
  int32 hardware_self_test = 7;
  // repeated TestResultCode (GENERAL=0 BOOT_UP=1 ... VTSENS=19), see HardwareSelfTest in core
  repeated int32 hardware_self_test_codes = 11;
  Location location = 8;
  AlignmentStats alignment_stats = 9;
  bool stowed = 10;
  bool overage_rate_limited = 14;
}

message GetGnssMeasurementResponse {
  string device_id = 1;
  repeated GnssMeasurement measurements = 2;
}

message GnssMeasurement {
  int64 time_of_validity_ns = 1;
  // SatelliteSystem: GPS=0 GALILEO=1 GLONASS=2 BEIDOU=3 SBAS=4 QZSS=5 IRNSS=6 STARLINK=7 STARSHIELD=8
  int32 satellite_system = 2;
  int32 prn = 3;
  Pseudorange pseudorange = 4;
  Ephemeris ephemeris = 5;
}

message Pseudorange {
  double pseudorange_m = 1;
  float pseudorange_variance_m2 = 2;
}

message Ephemeris {
  SatnavTime sv_data_time = 1;
  int32 coordinate_frame = 2;
  Vector3 sv_pos_m = 3;
  Vector3 sv_vel_m = 4;
}

