    uint32 temp = 2;
    double temp2 = 3;
    uint32 power_reduction = 4;
    uint32 duty_cycle = 5;
  }
  message AntennaStatus {
    float rssi1 = 1;
    float rssi2 = 2;
    float rssi3 = 3;
    float rssi4 = 4;
  }
  // WifiConfig.Band: UNKNOWN=0 RF_2GHZ=2 RF_5GHZ=5 RF_5GHZ_HIGH=6
  int32 band = 1;
  NetworkInterface.RxStats rx_stats = 2;
  NetworkInterface.TxStats tx_stats = 3;
  ThermalStatus thermal_status = 4;
  AntennaStatus antenna_status = 5;
}

