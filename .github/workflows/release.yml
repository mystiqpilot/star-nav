name: Release

# Push a tag like v0.2.0. Needs repository secrets: STARNAV_KEYSTORE_BASE64 (the release
# keystore, base64), STARNAV_STORE_PASSWORD, STARNAV_KEY_ALIAS, STARNAV_KEY_PASSWORD.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.STARNAV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "STARNAV_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STARNAV_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APKs and bundle
        env:
          STARNAV_STORE_PASSWORD: ${{ secrets.STARNAV_STORE_PASSWORD }}
          STARNAV_KEY_ALIAS: ${{ secrets.STARNAV_KEY_ALIAS }}
          STARNAV_KEY_PASSWORD: ${{ secrets.STARNAV_KEY_PASSWORD }}
          STARNAV_REQUIRE_RELEASE_KEY: "true"
        run: ./gradlew --stacktrace :core:test :app:assembleFossRelease :app:assemblePlayRelease :app:bundlePlayRelease
      - name: Collect artifacts
        run: |
          mkdir -p dist
          v="${GITHUB_REF_NAME#v}"
          # app-<flavor>-<abi or universal>-release.apk -> star-nav-<version>-<flavor>-<abi>.apk
          for f in app/build/outputs/apk/*/release/app-*-release.apk; do
            n="$(basename "$f" -release.apk)"
            cp "$f" "dist/star-nav-$v-${n#app-}.apk"
          done
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "dist/star-nav-$v-play.aab"
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
