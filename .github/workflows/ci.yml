name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2 build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug builds
        run: ./gradlew --stacktrace :core:test :tools:installDist :app:lintFossDebug :app:lintPlayDebug :app:assembleFossDebug :app:assemblePlayDebug
      - name: Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
