name: Pages

# Publishes site/ (Star Nav's web page, the same as starnav.apachi.tools) on GitHub Pages under /<repo>/.
# .github/pages-prepare.py adapts the copy to that path; site/ itself stays as it is served from a domain root.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/pages-prepare.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the page for /${{ github.event.repository.name }}/
        run: python3 -I .github/pages-prepare.py site _site "/${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
